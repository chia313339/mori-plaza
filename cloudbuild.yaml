# Cloud Build 配置檔案
# 用於自動化構建和部署到 Cloud Run

steps:
  # 步驟 1: 構建 Docker 映像
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mori-plaza:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mori-plaza:latest'
      - '.'
    timeout: 1200s

  # 步驟 2: 推送映像到 Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/mori-plaza'

  # 步驟 3: 部署到 Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mori-plaza'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mori-plaza:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'  # 可改為您想要的區域
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # 允許公開訪問
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'  # 設定記憶體限制
      - '--cpu'
      - '1'      # 設定 CPU 限制
      - '--max-instances'
      - '10'     # 最大實例數
      - '--min-instances'
      - '0'      # 最小實例數（0 = 可縮放至零）

# 構建的映像
images:
  - 'gcr.io/$PROJECT_ID/mori-plaza:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/mori-plaza:latest'

# 構建超時設定
timeout: 1800s